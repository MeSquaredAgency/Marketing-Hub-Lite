<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>APN quote card</title>
<!--
  Template: quote-card (APN)
  Formats: square 1080x1080, portrait 1080x1350, story 1080x1920, landscape 1200x628
  Fields: kicker, quote, name, role, photo (optional headshot or property photo)
  Use for testimonials (with consent recorded in Assets), agent quotes, market comment.
  The legal line is fixed. Do not remove or restyle it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111; --charcoal: #2e2e2e; --stone: #f5f4f1; --white: #ffffff;
    --lime: #8dc600; --lime-light: #a3d93a;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --w: 1080px; --h: 1080px; --pad: 80px;
  }
  body[data-format="square"]    { --w: 1080px; --h: 1080px; }
  body[data-format="portrait"]  { --w: 1080px; --h: 1350px; }
  body[data-format="story"]     { --w: 1080px; --h: 1920px; --pad: 96px; }
  body[data-format="landscape"] { --w: 1200px; --h: 628px;  --pad: 56px; }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--ink); }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: var(--sans); color: var(--white); }

  .tile { position: relative; width: var(--w); height: var(--h); padding: var(--pad); display: grid; grid-template-rows: auto 1fr auto; gap: 32px; }
  .tile::before { content: ""; position: absolute; left: 0; top: 0; width: 18px; height: 100%; background: var(--lime); }
  .kicker { font-size: 24px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--lime-light); }
  .quote { align-self: center; font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 58px; line-height: 1.22; letter-spacing: -.005em; }
  .quote::before { content: "\201C"; color: var(--lime); font-style: normal; margin-right: 4px; }
  .quote::after { content: "\201D"; color: var(--lime); font-style: normal; margin-left: 4px; }
  .who { display: flex; align-items: center; gap: 24px; }
  .who img { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; border: 4px solid var(--lime); }
  .who img[src=""] { display: none; }
  .name { font-size: 30px; font-weight: 700; }
  .role { font-size: 24px; color: var(--stone); opacity: .85; margin-top: 4px; }
  .foot { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,.16); padding-top: 24px; }
  .wordmark { font-family: var(--serif); font-weight: 700; font-size: 34px; }
  .wordmark small { font-family: var(--sans); font-weight: 500; font-size: 18px; color: var(--lime-light); margin-left: 8px; letter-spacing: .12em; text-transform: uppercase; }
  .legal { font-size: 20px; color: var(--stone); opacity: .9; letter-spacing: .03em; }

  body[data-format="story"] .quote { font-size: 74px; }
  body[data-format="landscape"] .tile { gap: 16px; }
  body[data-format="landscape"] .quote { font-size: 38px; }
  body[data-format="landscape"] .who img { width: 72px; height: 72px; }
  body[data-format="landscape"] .name { font-size: 24px; }
  body[data-format="landscape"] .role { font-size: 19px; }
  body[data-format="landscape"] .foot { padding-top: 14px; }
  body[data-format="landscape"] .legal { font-size: 16px; }
  body[data-format="landscape"] .kicker { font-size: 18px; }
</style>
</head>
<body data-format="{{format}}">
  <div class="tile">
    <div class="kicker">{{kicker}}</div>
    <div class="quote">{{quote}}</div>
    <div>
      <div class="who">
        <img src="{{photo}}" alt="">
        <div>
          <div class="name">{{name}}</div>
          <div class="role">{{role}}</div>
        </div>
      </div>
      <div class="foot" style="margin-top:28px">
        <div class="wordmark">APN<small>Real Estate</small></div>
        <div class="legal">Adelaide Property Network | RLA 255336</div>
      </div>
    </div>
  </div>
</body>
</html>
