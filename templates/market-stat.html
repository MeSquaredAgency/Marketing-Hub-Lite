<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>APN market stat</title>
<!--
  Template: market-stat (APN)
  Formats: square 1080x1080, portrait 1080x1350, story 1080x1920, landscape 1200x628
  Fields: kicker, stat, unit, label, source, note
  Use for one verified number from the Facts tab: days on market, median price, rent achieved, vacancy rate.
  `source` must name the Facts row's source and date. The legal line is fixed.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111; --charcoal: #2e2e2e; --stone: #f5f4f1; --white: #ffffff;
    --lime: #8dc600; --lime-light: #a3d93a;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --w: 1080px; --h: 1080px; --pad: 84px;
  }
  body[data-format="square"]    { --w: 1080px; --h: 1080px; }
  body[data-format="portrait"]  { --w: 1080px; --h: 1350px; }
  body[data-format="story"]     { --w: 1080px; --h: 1920px; --pad: 100px; }
  body[data-format="landscape"] { --w: 1200px; --h: 628px;  --pad: 56px; }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--lime); }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: var(--sans); color: var(--ink); }

  .tile { position: relative; width: var(--w); height: var(--h); padding: var(--pad); display: grid; grid-template-rows: auto 1fr auto; gap: 28px; }
  .tile::before { content: ""; position: absolute; inset: 0; background:
    repeating-linear-gradient(135deg, rgba(17,17,17,.06) 0 2px, transparent 2px 28px); }
  .tile > * { position: relative; }
  .kicker { font-size: 24px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .main { align-self: center; display: grid; gap: 14px; }
  .stat { font-family: var(--serif); font-weight: 700; font-size: 260px; line-height: 1; margin-bottom: 18px; letter-spacing: -.03em; display: flex; align-items: baseline; gap: 12px; }
  .stat .unit { font-family: var(--sans); font-weight: 600; font-size: 64px; letter-spacing: 0; }
  .stat .unit:empty { display: none; }
  .label { font-size: 44px; font-weight: 600; line-height: 1.2; max-width: 18ch; }
  .source { font-size: 24px; color: var(--charcoal); margin-top: 8px; }
  .note { font-size: 22px; color: var(--charcoal); }
  .note:empty { display: none; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 24px; border-top: 2px solid rgba(17,17,17,.25); padding-top: 22px; }
  .wordmark { font-family: var(--serif); font-weight: 700; font-size: 34px; }
  .wordmark small { font-family: var(--sans); font-weight: 600; font-size: 16px; margin-left: 8px; letter-spacing: .12em; text-transform: uppercase; }
  .legal { font-size: 20px; letter-spacing: .03em; }

  body[data-format="story"] .stat { font-size: 340px; }
  body[data-format="story"] .label { font-size: 56px; }
  body[data-format="landscape"] .tile { gap: 12px; }
  body[data-format="landscape"] .stat { font-size: 150px; }
  body[data-format="landscape"] .stat .unit { font-size: 40px; }
  body[data-format="landscape"] .label { font-size: 28px; }
  body[data-format="landscape"] .source, body[data-format="landscape"] .note { font-size: 17px; }
  body[data-format="landscape"] .kicker { font-size: 18px; }
  body[data-format="landscape"] .foot { padding-top: 12px; }
  body[data-format="landscape"] .legal { font-size: 16px; }
</style>
</head>
<body data-format="{{format}}">
  <div class="tile">
    <div class="kicker">{{kicker}}</div>
    <div class="main">
      <div class="stat">{{stat}}<span class="unit">{{unit}}</span></div>
      <div class="label">{{label}}</div>
      <div class="source">{{source}}</div>
      <div class="note">{{note}}</div>
    </div>
    <div class="foot">
      <div class="wordmark">APN<small>Real Estate</small></div>
      <div class="legal">Adelaide Property Network | RLA 255336</div>
    </div>
  </div>
</body>
</html>
