<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>APN listing tile</title>
<!--
  Template: listing-tile (APN)
  Formats: square 1080x1080, portrait 1080x1350, story 1080x1920, landscape 1200x628, gbp 1200x900
  Fields: status, address, suburb, price, beds, baths, cars, land, agent, agent_phone, photo, open_time
  The legal line is fixed. Do not remove or restyle it.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111111; --charcoal: #2e2e2e; --stone: #f5f4f1; --white: #ffffff;
    --lime: #8dc600; --lime-light: #a3d93a;
    --serif: "Playfair Display", Georgia, serif;
    --sans: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    --w: 1080px; --h: 1080px; --pad: 56px;
  }
  body[data-format="square"]    { --w: 1080px; --h: 1080px; }
  body[data-format="portrait"]  { --w: 1080px; --h: 1350px; }
  body[data-format="story"]     { --w: 1080px; --h: 1920px; --pad: 72px; }
  body[data-format="landscape"] { --w: 1200px; --h: 628px;  --pad: 44px; }
  body[data-format="gbp"]       { --w: 1200px; --h: 900px;  --pad: 52px; }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: var(--ink); }
  body { width: var(--w); height: var(--h); overflow: hidden; font-family: var(--sans); color: var(--white); }

  .tile { position: relative; width: var(--w); height: var(--h); display: grid; grid-template-rows: 1fr auto; }
  .photo { position: relative; overflow: hidden; background: var(--charcoal); }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(17,17,17,.55) 0%, rgba(17,17,17,0) 45%); }

  .status { position: absolute; top: var(--pad); left: var(--pad); z-index: 2;
    background: var(--lime); color: var(--ink); font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    font-size: 26px; padding: 14px 22px; border-radius: 2px; }
  .open { position: absolute; top: var(--pad); right: var(--pad); z-index: 2;
    background: rgba(17,17,17,.78); color: var(--white); font-weight: 600; font-size: 24px; padding: 14px 20px; border-radius: 2px; }
  .open:empty { display: none; }

  .panel { background: var(--ink); padding: calc(var(--pad) * .8) var(--pad) var(--pad); display: grid; gap: 22px; }
  .address { font-family: var(--serif); font-weight: 600; font-size: 60px; line-height: 1.08; }
  .suburb { font-size: 30px; font-weight: 500; color: var(--lime-light); letter-spacing: .02em; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
  .price { font-family: var(--serif); font-size: 46px; font-weight: 600; }
  .price:empty { display: none; }
  .specs { display: flex; gap: 28px; font-size: 28px; font-weight: 500; color: var(--stone); }
  .specs span b { color: var(--white); font-weight: 700; margin-right: 6px; }
  .specs span:empty { display: none; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 24px; border-top: 1px solid rgba(255,255,255,.16); padding-top: 22px; }
  .agent { font-size: 26px; color: var(--stone); }
  .agent b { color: var(--white); font-weight: 600; }
  .wordmark { font-family: var(--serif); font-weight: 700; font-size: 34px; letter-spacing: .02em; }
  .wordmark small { font-family: var(--sans); font-weight: 500; font-size: 18px; color: var(--lime-light); margin-left: 8px; letter-spacing: .12em; text-transform: uppercase; }
  .legal { font-size: 20px; color: var(--stone); opacity: .9; letter-spacing: .03em; }

  body[data-format="story"] .address { font-size: 76px; }
  body[data-format="story"] .panel { gap: 30px; }
  body[data-format="landscape"] .tile { grid-template-rows: none; grid-template-columns: 1.15fr 1fr; }
  body[data-format="landscape"] .panel { padding: var(--pad); gap: 16px; align-content: center; }
  body[data-format="landscape"] .address { font-size: 44px; }
  body[data-format="landscape"] .price { font-size: 36px; }
  body[data-format="landscape"] .specs { font-size: 22px; gap: 18px; }
  body[data-format="landscape"] .foot { padding-top: 14px; }
  body[data-format="landscape"] .agent, body[data-format="landscape"] .legal { font-size: 18px; }
  body[data-format="landscape"] .status { font-size: 20px; padding: 10px 16px; }
  body[data-format="gbp"] .address { font-size: 52px; }
</style>
</head>
<body data-format="{{format}}">
  <div class="tile">
    <div class="photo">
      <div class="status">{{status}}</div>
      <div class="open">{{open_time}}</div>
      <img src="{{photo}}" alt="">
    </div>
    <div class="panel">
      <div>
        <div class="address">{{address}}</div>
        <div class="suburb">{{suburb}}</div>
      </div>
      <div class="row">
        <div class="price">{{price}}</div>
        <div class="specs">
          <span><b>{{beds}}</b>bed</span>
          <span><b>{{baths}}</b>bath</span>
          <span><b>{{cars}}</b>car</span>
          <span>{{land}}</span>
        </div>
      </div>
      <div class="foot">
        <div class="agent"><b>{{agent}}</b> · {{agent_phone}}</div>
        <div class="wordmark">APN<small>Real Estate</small></div>
      </div>
      <div class="legal">Adelaide Property Network | RLA 255336</div>
    </div>
  </div>
</body>
</html>
