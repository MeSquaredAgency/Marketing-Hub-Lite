  .tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--bar-track); color: var(--ink-2); white-space: nowrap; }
  .tag.unapproved { background: var(--bad-soft); color: var(--bad); }
  .tag.fact, .tag.budget, .tag.stale { background: var(--warn-soft); color: var(--warn); }
  .attention a.brand-link { font-weight: 600; color: var(--ink); text-decoration: none; margin-right: 6px; }
  .attention a.brand-link:hover { text-decoration: underline; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  .brand-card { display: grid; gap: 12px; min-width: 0; }
  .brand-card header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .brand-card h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .brand-card h2 a { color: inherit; text-decoration: none; }
  .brand-card h2 a:hover { text-decoration: underline; }
  .mini { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mini .stat { padding: 8px 10px; }
  .mini .value { font-size: 20px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 14px; color: var(--ink-2); }
  .kv b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

  .stat .src { font-size: 11px; color: var(--ink-3); }

  .spend-row { display: grid; grid-template-columns: 72px 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .spend-row .track { position: relative; height: 10px; background: var(--bar-track); border-radius: 2px; }
  .spend-row .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--bar-fill); border-radius: 0 2px 2px 0; }
  .spend-row .fill.over { background: var(--bad); } .spend-row .fill.near { background: var(--warn); }
  .spend-row .tick { position: absolute; top: -3px; bottom: -3px; border-left: 2px solid var(--ink-3); }
  .spend-row .pace { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed var(--accent); }
  .spend-row .amt { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .spend-row .amt b { color: var(--ink); font-weight: 600; }
  .spend-total { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 8px; font-size: 14px; color: var(--ink-2); }
  .spend-total b { color: var(--ink); font-variant-numeric: tabular-nums; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--ink-2); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  td.num, th.num { font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  td .wait { color: var(--ink-3); font-size: 12px; } td .wait.old { color: var(--warn); font-weight: 600; }
  .table-wrap { overflow-x: auto; }
  .empty { color: var(--ink-3); font-size: 14px; margin: 0; }
  .mover { font-variant-numeric: tabular-nums; } .mover.up { color: var(--good); } .mover.down { color: var(--bad); }
  ol.top { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; }
  ol.top b { font-weight: 600; } ol.top span { color: var(--ink-2); }

  .tracker { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .trigger { border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 4px; }
  .trigger .n { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .trigger .t { font-weight: 600; font-size: 14px; }
  .trigger .r { font-size: 12px; color: var(--ink-2); }

  .countdown { font-size: 14px; color: var(--ink-2); } .countdown b { color: var(--ink); }

  footer { color: var(--ink-3); font-size: 13px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: no-preference) { .spend-row .fill { transition: width .4s ease; } }
</style>

const num = n => Number(n).toLocaleString('en-AU');
const aud = n => '$' + Number(n).toLocaleString('en-AU', { maximumFractionDigits: 0 });
const parseDate = iso => { const d = new Date(String(iso).slice(0, 10) + 'T00:00:00'); return isNaN(d) ? null : d; };
const dateAU = (iso, opts = { weekday: 'short', day: 'numeric', month: 'short' }) => { const d = parseDate(iso); return d ? d.toLocaleDateString('en-AU', opts) : esc(iso); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const isoDate = d => d.toISOString().slice(0, 10);
const DATA = { current: null };

function delta(cur, prior) {
  if (prior == null || prior === 0) return '';
  const pct = Math.round((cur - prior) / prior * 100);
  const cls = pct > 0 ? 'up' : pct < 0 ? 'down' : '';
  return `<div class="delta ${cls}">${pct > 0 ? '+' : ''}${pct}% vs prior week</div>`;
}

function sparkline(values, weeks) {
  if (!values || values.length < 2) return '';
  const W = 200, H = 34, pad = 3;
  const min = Math.min(...values), max = Math.max(...values), span = max - min || 1;
  const x = i => pad + i * (W - pad * 2) / (values.length - 1);
  const y = v => H - pad - (v - min) / span * (H - pad * 2);
  const pts = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  const line = 'M' + pts.join(' L');
  const area = `${line} L${x(values.length - 1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`;
  const last = values.length - 1;
  const dots = values.map((v, i) => `<rect x="${(x(i) - (W / values.length) / 2).toFixed(1)}" y="0" width="${(W / values.length).toFixed(1)}" height="${H}" fill="transparent" data-i="${i}" data-v="${v}" data-w="${esc(weeks?.[i] ?? '')}"></rect>`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="area" d="${area}"/><path class="line" d="${line}"/><circle cx="${x(last).toFixed(1)}" cy="${y(values[last]).toFixed(1)}" r="3"/>${dots}</svg>`;
}

function renderStats(results, weeks, compact) {
  const keys = Object.keys(results || {});
  if (!keys.length) return '<p class="empty">No results yet.</p>';
  const shown = compact ? keys.slice(0, 3) : keys;
  return `<div class="${compact ? 'mini' : 'stats'}">${shown.map(k => { const r = results[k]; return `
    <div class="stat"><div class="label">${esc(r.label)}</div><div class="value">${num(r.value)}</div>${compact ? '' : delta(r.value, r.prior)}
      ${compact ? '' : sparkline(r.history, weeks)}${compact ? '' : `<div class="src">${esc(r.source)}${r.history ? ' · ' + r.history.length + ' weeks' : ''}</div><div class="tip"></div>`}</div>`; }).join('')}</div>`;
}

function monthPace(month, snapshotDate) {
  const d = parseDate(snapshotDate); if (!d || !month) return null;
  const [y, m] = month.split('-').map(Number);
  const days = new Date(y, m, 0).getDate();
  const day = (d.getFullYear() === y && d.getMonth() + 1 === m) ? d.getDate() : (d > new Date(y, m, 0) ? days : 0);
  return { frac: day / days, day, days };
}

function renderSpend(spend, snapshotDate) {
  const cats = spend?.categories || [];
  if (!cats.length) return '<p class="empty">No budget set.</p>';
  const max = Math.max(...cats.map(c => Math.max(c.budget, c.spent)), 1);
  const pace = monthPace(spend.month, snapshotDate);
  let ts = 0, tb = 0;
  const rows = cats.map(c => {
    ts += c.spent; tb += c.budget;
    const ratio = c.budget ? c.spent / c.budget : 0;
    const cls = ratio > 1 ? 'over' : ratio >= .8 ? 'near' : '';
    const w = Math.min(100, c.spent / max * 100), bw = Math.min(100, c.budget / max * 100);
    const pw = pace ? Math.min(100, c.budget * pace.frac / max * 100) : null;
    return `<div class="spend-row"><span>${esc(c.name)}</span>
      <div class="track" title="${esc(c.name)}: ${aud(c.spent)} spent of ${aud(c.budget)}${pace ? `; on-pace point ${aud(c.budget * pace.frac)}` : ''}">
        <div class="fill ${cls}" style="width:${w}%"></div>${pw != null ? `<div class="pace" style="left:${pw}%"></div>` : ''}<div class="tick" style="left:${bw}%"></div></div>
      <span class="amt"><b>${aud(c.spent)}</b> / ${aud(c.budget)}</span></div>`;
  }).join('');
  let paceTag = '';
  if (pace && tb) {
    const expected = tb * pace.frac;
    const diff = ts - expected;
    const cls = ts > tb ? 'bad' : Math.abs(diff) <= tb * .05 ? 'good' : diff > 0 ? 'warn' : 'muted';
    const label = ts > tb ? 'over budget' : Math.abs(diff) <= tb * .05 ? 'on pace' : diff > 0 ? `${aud(diff)} ahead of pace` : `${aud(-diff)} under pace`;
    paceTag = `<span class="pill ${cls}">${label}</span>`;
  }
  return `<div class="spend">${rows}<div class="spend-total"><span>Month to date, ex-GST${pace ? ` · day ${pace.day} of ${pace.days}` : ''}</span><span>${paceTag} <b>${aud(ts)} of ${aud(tb)}</b></span></div>
    <div class="legend"><span><i style="background:var(--bar-fill)"></i>Spent</span><span><i style="border-left:2px solid var(--ink-3);width:0;height:12px"></i> Budget</span><span><i style="border-left:2px dashed var(--accent);width:0;height:12px"></i> On-pace today</span></div></div>`;
}

function sheetLink(data, row) {
  if (!data.sheet_url || !row) return '';
  const gid = data.calendar_gid ?? '0';
  return `${data.sheet_url}#gid=${encodeURIComponent(gid)}&range=A${row}`;
}

function renderQueue(queue, data) {
  if (!queue?.length) return '<p class="empty">Nothing waiting for approval.</p>';
  return `<div class="table-wrap"><table><thead><tr><th>Row</th><th>Date</th><th>Platform</th><th>Post</th><th class="num">Waiting</th></tr></thead><tbody>
    ${queue.map(q => { const l = sheetLink(data, q.row); return `<tr><td class="num" style="text-align:left">${l ? `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(q.id)}</a>` : esc(q.id)}</td><td style="white-space:nowrap">${dateAU(q.date)}</td><td>${esc(q.platform)}</td><td>${esc(q.copy)}</td>
      <td class="num"><span class="wait ${q.since_days >= 3 ? 'old' : ''}">${q.since_days}d</span></td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function renderWeek(b, data) {
  const start = parseDate(data.snapshot_date); if (!start) return '';
  const posts = b.calendar_week || [];
  const days = Array.from({ length: 7 }, (_, i) => addDays(start, i));
  const today = isoDate(new Date());
  return `<div class="week">${days.map(d => { const iso = isoDate(d); const ps = posts.filter(p => String(p.date).slice(0, 10) === iso);
    return `<div class="day ${iso === today ? 'today' : ''}"><div class="d">${d.toLocaleDateString('en-AU', { weekday: 'short' })}<span>${d.getDate()}</span></div>
      ${ps.map(p => { const l = sheetLink(data, p.row); const inner = `<b>${esc(p.platform)}</b> ${esc(p.copy)}`; return `<div class="post ${esc(p.status).replace(/\s+/g, '.')}" title="${esc(p.id)} · ${esc(p.status)} · ${esc(p.copy)}">${l ? `<a href="${esc(l)}" target="_blank" rel="noopener" style="color:inherit;text-decoration:none">${inner}</a>` : inner}</div>`; }).join('')}
    </div>`; }).join('')}</div>
    <div class="legend"><span><i style="background:var(--good)"></i>Scheduled / Published</span><span><i style="background:var(--warn)"></i>In review</span><span><i style="background:var(--ink-3)"></i>Idea</span></div>`;
}

function renderPlatforms(platforms) {
  if (!platforms?.length) return '';
  return `<div class="table-wrap"><table><thead><tr><th>Platform</th><th class="num">Posts</th><th class="num">Reach</th><th class="num">Eng.</th><th class="num">Rate</th><th class="num">New fol.</th></tr></thead><tbody>
    ${platforms.map(p => `<tr><td>${esc(p.name)}</td><td class="num">${num(p.posts)}</td><td class="num">${num(p.reach)}</td><td class="num">${num(p.engagement)}</td><td class="num">${p.reach ? (p.engagement / p.reach * 100).toFixed(1) + '%' : '–'}</td><td class="num">${p.followers_delta > 0 ? '+' : ''}${num(p.followers_delta)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

function renderMovers(movers) {
  if (!movers?.length) return '<p class="empty">No ranking changes to report.</p>';
  return `<div class="table-wrap"><table><thead><tr><th>Query</th><th class="num">Position</th><th class="num">Change</th><th class="num">Clicks</th></tr></thead><tbody>
    ${movers.map(m => { const ch = m.prior_position - m.position; const cls = ch > 0 ? 'up' : ch < 0 ? 'down' : ''; return `<tr><td>${esc(m.query)}</td><td class="num">${m.position.toFixed(1)}</td><td class="num mover ${cls}">${ch > 0 ? '▲ ' : ch < 0 ? '▼ ' : ''}${Math.abs(ch).toFixed(1)}</td><td class="num">${num(m.clicks)}</td></tr>`; }).join('')}
  </tbody></table></div>`;
}

function renderTop(posts) {
  if (!posts?.length) return '<p class="empty">No posts last week.</p>';
  return `<ol class="top">${posts.map(p => `<li><b>${esc(p.copy)}</b> <span>${esc(p.platform)}, ${num(p.engagement)} engagements</span>${p.link ? ` <a href="${esc(p.link)}" target="_blank" rel="noopener">open</a>` : ''}</li>`).join('')}</ol>`;
}

function renderBrandDetail(b, data) {
  const w = b.this_week || {};
  const facts = (b.facts_expiring || []).map(f => { const d = parseDate(f.expires_on); const left = d ? Math.round((d - parseDate(data.snapshot_date)) / 864e5) : null; return `<li>${esc(f.id)}: ${esc(f.fact)} <span class="pill ${left != null && left <= 7 ? 'warn' : 'muted'}">${left != null ? (left < 0 ? 'expired' : left + ' days') : esc(f.expires_on)}</span></li>`; }).join('');
  const links = [b.links?.project && `<a href="${esc(b.links.project)}" target="_blank" rel="noopener">Project</a>`, data.sheet_url && `<a href="${esc(data.sheet_url)}" target="_blank" rel="noopener">Marketing Sheet</a>`, b.links?.drive && `<a href="${esc(b.links.drive)}" target="_blank" rel="noopener">Drive</a>`, b.links?.metricool && `<a href="${esc(b.links.metricool)}" target="_blank" rel="noopener">Metricool</a>`].filter(Boolean).join('');
  return `<section class="detail card">
    <header><h2>${esc(b.name)}</h2><div class="links">${links}</div></header>
    ${b.attention?.length ? `<div class="attention"><h2 class="eyebrow">Needs attention</h2><ul>${b.attention.map(a => `<li><span class="tag ${esc(a.kind)}">${esc(a.kind)}</span><span>${esc(a.text)}</span></li>`).join('')}</ul></div>` : ''}
    <div><h3>This week · ${w.planned ?? 0} planned, ${w.scheduled ?? 0} scheduled, ${w.in_review ?? 0} in review, ${w.idea ?? 0} ideas</h3>${renderWeek(b, data)}</div>
    <div><h3>Last week · ${esc(data.period?.last_week || '')}</h3>${renderStats(b.results, data.history_weeks, false)}</div>
    <div class="cols">
      <div><h3>By platform</h3>${renderPlatforms(b.platforms) || '<p class="empty">No platform data.</p>'}<h3 style="margin-top:18px">Top posts</h3>${renderTop(b.top_posts || (b.top_post ? [b.top_post] : []))}</div>
      <div><h3>Approval queue</h3>${renderQueue(b.queue, data)}${facts ? `<h3 style="margin-top:18px">Facts expiring within 14 days</h3><ul style="margin:0;padding-left:18px;font-size:14px;display:grid;gap:4px">${facts}</ul>` : ''}</div>
    </div>
    <div class="cols">
      <div><h3>Spend vs budget, ${esc(b.spend?.month || '')}</h3>${renderSpend(b.spend, data.snapshot_date)}</div>
      <div><h3>Search movers</h3>${renderMovers(b.search_movers)}</div>
    </div>
  </section>`;
}

function renderOverview(data) {
  const items = (data.brands || []).flatMap(b => (b.attention || []).map(a => ({ brand: b, ...a })));
  const attention = `<section class="attention ${items.length ? '' : 'clear'}"><h2 class="eyebrow">${items.length ? `Needs attention (${items.length})` : 'Nothing needs attention'}</h2>
    ${items.length ? `<ul>${items.map(i => `<li><span class="tag ${esc(i.kind)}">${esc(i.kind)}</span><span><a class="brand-link" href="#${esc(i.brand.id)}">${esc(i.brand.name)}</a>${esc(i.text)}</span></li>`).join('')}</ul>` : ''}</section>`;
  const cards = `<div class="grid-3">${(data.brands || []).map(b => {
    const cats = b.spend?.categories || []; const ts = cats.reduce((a, c) => a + c.spent, 0), tb = cats.reduce((a, c) => a + c.budget, 0);
    const pace = monthPace(b.spend?.month, data.snapshot_date); const w = b.this_week || {};
    let paceCls = 'muted', paceTxt = 'no budget';
    if (tb && pace) { const diff = ts - tb * pace.frac; paceCls = ts > tb ? 'bad' : Math.abs(diff) <= tb * .05 ? 'good' : diff > 0 ? 'warn' : 'muted'; paceTxt = ts > tb ? 'over' : Math.abs(diff) <= tb * .05 ? 'on pace' : diff > 0 ? 'ahead' : 'under'; }
    const oldest = Math.max(0, ...(b.queue || []).map(q => q.since_days || 0));
    return `<section class="card brand-card"><header><h2><a href="#${esc(b.id)}">${esc(b.name)}</a></h2>${b.attention?.length ? `<span class="pill bad">${b.attention.length} flag${b.attention.length > 1 ? 's' : ''}</span>` : '<span class="pill good">clear</span>'}</header>
      ${renderStats(b.results, data.history_weeks, true)}
      <div class="kv">
        <span>This week</span><span><b>${w.planned ?? 0}</b> planned · <b>${w.scheduled ?? 0}</b> scheduled</span>
        <span>Waiting on you</span><span><b>${(b.queue || []).length}</b>${oldest >= 3 ? ` <span class="pill warn">oldest ${oldest}d</span>` : ''}</span>
        <span>Spend</span><span><b>${aud(ts)}</b> of ${aud(tb)} <span class="pill ${paceCls}">${paceTxt}</span></span>
      </div></section>`; }).join('')}</div>`;
  const pl = data.pain_log || { total: 0, by_trigger: {} };
  const started = parseDate(data.started_on), snap = parseDate(data.snapshot_date);
  const weekNo = started && snap ? Math.floor((snap - started) / (7 * 864e5)) + 1 : null;
  const tracker = `<section class="card"><h2 class="eyebrow">Week-8 decision tracker</h2>
    <p class="countdown">${weekNo ? `Week <b>${weekNo}</b> of the lite setup${weekNo < 8 ? `, <b>${8 - weekNo}</b> to go` : ', decision due'}.` : ''} <b>${num(pl.total || 0)}</b> pain log rows so far. Build only what the log justifies.</p>
    <div class="tracker">${TRIGGERS.map(t => { const n = pl.by_trigger?.[t.key] || 0; const hit = n >= t.threshold; return `<div class="trigger ${hit ? 'hit' : ''}"><div class="n">${n}</div><div class="t">${esc(t.key)}</div><div class="r">${esc(t.rule)}</div>${hit ? '<span class="pill warn">threshold met</span>' : ''}</div>`; }).join('')}</div>
    ${pl.recent?.length ? `<h3 style="margin-top:16px">Recent pain</h3><div class="table-wrap"><table><thead><tr><th>Date</th><th>Brand</th><th>What happened</th><th>Points to</th></tr></thead><tbody>${pl.recent.map(r => `<tr><td style="white-space:nowrap">${dateAU(r.date, { day: 'numeric', month: 'short' })}</td><td>${esc(r.brand)}</td><td>${esc(r.what_happened)}</td><td>${esc(r.build_trigger)}</td></tr>`).join('')}</tbody></table></div>` : ''}
  </section>`;
  return attention + cards + tracker;
}

function tabsFor(data) {
  const tabs = [{ id: 'overview', name: 'Overview', count: null }, ...(data.brands || []).map(b => ({ id: b.id, name: b.name, count: (b.attention || []).length }))];
  return tabs;
}

function currentTab(data) {
  const tabs = tabsFor(data);
  const h = (location.hash || '').replace('#', '');
  if (tabs.some(t => t.id === h)) return h;
  try { const s = localStorage.getItem('me2-dash-tab'); if (tabs.some(t => t.id === s)) return s; } catch {}
  return 'overview';
}

function show(id) {
  const data = DATA.current; if (!data) return;
  const tabs = tabsFor(data);
  const nav = document.getElementById('tabs');
  nav.innerHTML = tabs.map((t, i) => `<button role="tab" id="tab-${esc(t.id)}" aria-selected="${t.id === id}" data-id="${esc(t.id)}" title="Key ${i + 1}">${esc(t.name)}${t.count != null ? `<span class="count ${t.count ? '' : 'zero'}">${t.count}</span>` : ''}</button>`).join('') + '<span class="hint">1–4</span>';
  nav.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { location.hash = b.dataset.id; }));
  const view = document.getElementById('view');
  view.style.display = 'grid'; view.style.gap = '22px';
  if (id === 'overview') view.innerHTML = renderOverview(data);
  else { const b = data.brands.find(x => x.id === id); view.innerHTML = b ? renderBrandDetail(b, data) : ''; }
  try { localStorage.setItem('me2-dash-tab', id); } catch {}
  wireSparklines(view);
}

function wireSparklines(root) {
  root.querySelectorAll('.stat').forEach(stat => {
    const tip = stat.querySelector('.tip'); const svg = stat.querySelector('svg.spark'); if (!tip || !svg) return;
    svg.addEventListener('mousemove', e => { const r = e.target.closest('rect[data-v]'); if (!r) return; tip.style.display = 'block'; tip.textContent = `${r.dataset.w ? r.dataset.w + ': ' : ''}${num(r.dataset.v)}`; });
    svg.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
}

function render(data) {
  DATA.current = data;
  document.getElementById('meta').innerHTML =
    `<b>${esc(data.week_label || '')}</b> · snapshot ${esc(data.snapshot_date || '')}` + (data.sample ? '<span class="flag">Example data</span>' : '');
  show(currentTab(data));
}

window.addEventListener('hashchange', () => { if (DATA.current) show(currentTab(DATA.current)); });
window.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = Number(e.key); if (!n || !DATA.current) return;
  const t = tabsFor(DATA.current)[n - 1]; if (t) location.hash = t.id;
});

fetch('data/portfolio.json', { cache: 'no-store' })
  .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
  .then(render)
  .catch(() => render(SAMPLE));
</script>
